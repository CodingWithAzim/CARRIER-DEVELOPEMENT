<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gradient Studio</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="main">

      <div class="app-card">

        <div class="top">
          <span class="small-title">COLOR STUDIO</span>

          <h1>Gradient Generator</h1>

          <p>Create your perfect background</p>
        </div>

        <div class="buttonDiv">
          <button class="buttonOne">#5B06D2</button>
          <button class="buttonTwo">#34BC59</button>
        </div>

        <div class="copyText">
          <span>YOUR CSS CODE</span>
        </div>

        <div class="showColor">
          background-image: linear-gradient(
          to right,
          rgb(91, 6, 210),
          rgb(52, 188, 89)
          );
        </div>

        <div class="bottom">
          <span class="dot"></span>
          Click a color to generate
        </div>

      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
