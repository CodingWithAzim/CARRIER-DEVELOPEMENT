<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <main class="profile-card">
    <div class="profile-image">
      <div class="avatar">A</div>
    </div>

    <h1>Azim</h1>
    <p class="role">Web Developer</p>

    <p class="bio">
      I am learning web development and building projects
      step by step with HTML, CSS and JavaScript.
    </p> 

    <div class="buttons">
      <a href="#" class="btn primary">Contact Me</a>
      <a href="#" class="btn secondary">View Profile</a>
    </div>
  </main>

</body>
</html>
