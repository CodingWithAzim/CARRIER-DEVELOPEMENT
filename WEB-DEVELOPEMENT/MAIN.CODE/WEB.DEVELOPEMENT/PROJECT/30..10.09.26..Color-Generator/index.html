<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="page">
  <main class="card">
    <span class="eyebrow">JavaScript + DOM</span>
    <h1>Color Generator</h1>

    <div id="swatch" class="swatch">#000000</div>

    <div class="controls">
      <button id="generate">Generate Color</button>
      <button id="copy">Copy HEX</button>
    </div>

    <p id="status" class="status">Click Generate Color.</p>
  </main>

  <script>
    const page = document.querySelector("#page");
    const swatch = document.querySelector("#swatch");
    const status = document.querySelector("#status");

    function randomHex() {
      const chars = "0123456789ABCDEF";
      let hex = "#";

      for (let i = 0; i < 6; i++) {
        hex += chars[Math.floor(Math.random() * 16)];
      }

      return hex;
    }

    function generateColor() {
      const color = randomHex();
      page.style.backgroundColor = color;
      swatch.textContent = color;
      swatch.style.color = getContrast(color);
      status.textContent = "Generated " + color;
    }

    function getContrast(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 155 ? "#111827" : "#FFFFFF";
    }

    document.querySelector("#generate").addEventListener("click", generateColor);

    document.querySelector("#copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(swatch.textContent);
        status.textContent = "Copied " + swatch.textContent;
      } catch {
        status.textContent = "Clipboard permission unavailable.";
      }
    });

    generateColor();
  </script>
</body>
</html>
