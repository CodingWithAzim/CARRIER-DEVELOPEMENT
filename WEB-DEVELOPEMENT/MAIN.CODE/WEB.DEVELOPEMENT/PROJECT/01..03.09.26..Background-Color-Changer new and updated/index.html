<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gradient Studio</title>

    <link rel="stylesheet" href="style.css" />
  </head>
 
  <body>
    <main class="main">
      <div class="app-card">
        <!-- HEADER --> 
        <div class="top">
          <span class="small-title"> COLOR STUDIO </span>

          <h1>Gradient Generator</h1>

          <p>Create your perfect background</p>
        </div>

        <!-- COLOR BUTTONS -->
        <div class="buttonDiv">
          <div class="colorControl">
            <span> CHANGE LEFT COLOR </span>

            <button class="buttonOne">#5B06D2</button>
          </div>

          <div class="colorControl">
            <span> CHANGE BOTH COLOR </span>

            <button class="buttonTwo">#34BC59</button>
          </div>

          <div class="colorControl">
            <span> CHANGE RIGHT COLOR </span>

            <button class="buttonThree">#49EE7A</button>
          </div>
        </div>

        <!-- CSS LABEL -->
        <div class="copyText">
          <span> YOUR CSS CODE </span>
        </div>

        <!-- GENERATED CSS -->
        <div class="showColor">
          background-image: linear-gradient( to right, rgb(91, 6, 210), rgb(73,
          238, 122) );
        </div>

        <!-- BOTTOM STATUS -->
        <div class="bottom">
          <span class="dot"></span>

          Click a button to generate
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
