<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="product-card">

    <div class="product-image">
      <span class="badge">NEW</span>
      <div class="product-shape"></div>
    </div>

    <div class="product-info">
      <p class="category">Wireless Audio</p>

      <h1>Pro Wireless Headphones</h1>

      <p class="description">
        Enjoy clear sound, comfortable ear cushions, and a modern design
        made for everyday listening.
      </p>

      <div class="rating">
        <span>★★★★★</span>
        <span class="rating-text">4.8 (124 reviews)</span>
      </div>

      <div class="bottom-row">
        <div class="price">
          <span class="current-price">$79.99</span>
          <span class="old-price">$99.99</span>
        </div>

        <button class="add-btn">Add to Cart</button>
      </div>
    </div>

  </main>

</body>
</html>
