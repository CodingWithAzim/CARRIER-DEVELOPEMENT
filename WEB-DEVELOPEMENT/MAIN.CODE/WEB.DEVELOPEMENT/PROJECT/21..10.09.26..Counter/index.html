<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Counter</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">JavaScript Beginner</span><h1>Counter</h1><div id="count" class="count">0</div><div class="controls"><button id="decrease">−</button><button id="reset">Reset</button><button id="increase">+</button></div></main><script>let count=0;const el=document.querySelector('#count');const render=()=>el.textContent=count;increase.onclick=()=>{count++;render()};decrease.onclick=()=>{count--;render()};reset.onclick=()=>{count=0;render()}</script></body></html>
