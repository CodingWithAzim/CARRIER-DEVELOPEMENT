<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temperature Converter</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">Conversion Tool</span><h1>Temperature Converter</h1><div class="grid"><label>Value<input id="value" type="number" value="25"></label><label>From<select id="from"><option>Celsius</option><option>Fahrenheit</option><option>Kelvin</option></select></label><label>To<select id="to"><option>Fahrenheit</option><option>Celsius</option><option>Kelvin</option></select></label></div><button id="convert">Convert</button><div id="result" class="result">77.00 °F</div></main><script>function c(v,u){return u==='Celsius'?v:u==='Fahrenheit'?(v-32)*5/9:v-273.15}function out(v,u){return u==='Celsius'?v:u==='Fahrenheit'?v*9/5+32:v+273.15}function run(){let v=Number(value.value);if(!Number.isFinite(v)){result.textContent='Enter a valid number.';return}let n=out(c(v,from.value),to.value);result.textContent=n.toFixed(2)+' °'+(to.value==='Celsius'?'C':to.value==='Fahrenheit'?'F':'K')}convert.onclick=run;[value,from,to].forEach(x=>x.addEventListener('input',run));run()</script></body></html>
