<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">Text Utility</span><h1>Word Counter</h1><p class="muted">Count words, characters and sentences.</p><textarea id="text" placeholder="Write something..."></textarea><div class="stats"><article><span>Words</span><strong id="words">0</strong></article><article><span>Characters</span><strong id="chars">0</strong></article><article><span>Sentences</span><strong id="sentences">0</strong></article></div></main><script>text.oninput=()=>{let v=text.value.trim();words.textContent=v?v.split(/\s+/).length:0;chars.textContent=text.value.length;sentences.textContent=v?v.split(/[.!?]+/).filter(Boolean).length:0}</script></body></html>
