<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">Conversion Tool</span><h1>Unit Converter</h1><div class="tabs"><button class="active" data-type="length">Length</button><button data-type="weight">Weight</button></div><label>Value<input id="value" type="number" value="1"></label><div class="grid"><label>From<select id="from"></select></label><label>To<select id="to"></select></label></div><div id="result" class="result">100 centimeter</div></main><script>const units={length:{meter:1,kilometer:1000,centimeter:.01,foot:.3048,mile:1609.344},weight:{gram:1,kilogram:1000,pound:453.59237,ounce:28.349523125}};let type='length';function fill(){let a=Object.keys(units[type]);from.innerHTML=a.map(x=>'<option>'+x+'</option>').join('');to.innerHTML=a.map(x=>'<option>'+x+'</option>').join('');to.value=a[1]||a[0];run()}function run(){let v=Number(value.value);if(!Number.isFinite(v)){result.textContent='Enter a valid number.';return}let n=v*units[type][from.value]/units[type][to.value];result.textContent=n.toLocaleString(undefined,{maximumFractionDigits:6})+' '+to.value}document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.type)return;type=e.target.dataset.type;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');fill()};[value,from,to].forEach(x=>x.addEventListener('input',run));[from,to].forEach(x=>x.addEventListener('change',run));fill()</script></body></html>
