<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Counter</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">Text Utility</span><h1>Character Counter</h1><p class="muted">Type below and watch the count update.</p><textarea id="text" maxlength="280" placeholder="Start typing..."></textarea><div class="meta"><span><strong id="count">0</strong> characters</span><span><strong id="left">280</strong> remaining</span></div></main><script>const t=document.querySelector('#text');function update(){count.textContent=t.value.length;left.textContent=280-t.value.length}t.oninput=update</script></body></html>
