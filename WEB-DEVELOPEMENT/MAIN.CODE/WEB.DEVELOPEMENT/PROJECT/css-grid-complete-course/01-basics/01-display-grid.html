<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>01 — display: grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>01 — display: grid</h1>
      <p>
        The parent becomes a grid container; its direct
        children become grid items.
      </p>
      <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
      </div>
    </main>
  </body>
</html>
