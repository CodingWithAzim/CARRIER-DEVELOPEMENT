<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><span class="eyebrow">JavaScript Beginner</span><h1>Password Generator</h1><p class="muted">Create a random password and copy it.</p><label>Length: <strong id="len">16</strong></label><input id="length" type="range" min="6" max="32" value="16"><div class="checks"><label><input id="nums" type="checkbox" checked> Numbers</label><label><input id="syms" type="checkbox" checked> Symbols</label></div><div class="output"><code id="pass">Generating...</code><button id="copy">Copy</button></div><button id="generate" class="primary">Generate Password</button><p id="status" class="status"></p></main><script>const L=document.querySelector('#length'),len=document.querySelector('#len'),pass=document.querySelector('#pass'),status=document.querySelector('#status');function gen(){let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';if(nums.checked)chars+='0123456789';if(syms.checked)chars+='!@#$%^&*()_+-=';let s='';for(let i=0;i<+L.value;i++)s+=chars[Math.floor(Math.random()*chars.length)];pass.textContent=s;status.textContent='New password generated.'}L.oninput=()=>len.textContent=L.value;generate.onclick=gen;copy.onclick=async()=>{try{await navigator.clipboard.writeText(pass.textContent);status.textContent='Copied.'}catch{status.textContent='Clipboard unavailable.'}};gen()</script></body></html>
