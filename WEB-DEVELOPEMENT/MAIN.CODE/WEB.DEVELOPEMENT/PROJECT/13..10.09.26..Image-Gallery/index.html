<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <span class="eyebrow">CSS Grid Practice</span>
      <h1>Image Gallery</h1>
      <p>Build a responsive gallery with different card sizes and clean spacing.</p>
    </header>

    <section class="gallery" aria-label="Image gallery">
      <figure class="item large"><div>01</div><figcaption>Mountain</figcaption></figure>
      <figure class="item tall"><div>02</div><figcaption>Forest</figcaption></figure>
      <figure class="item"><div>03</div><figcaption>Ocean</figcaption></figure>
      <figure class="item"><div>04</div><figcaption>Desert</figcaption></figure>
      <figure class="item wide"><div>05</div><figcaption>City</figcaption></figure>
      <figure class="item"><div>06</div><figcaption>Lake</figcaption></figure>
      <figure class="item"><div>07</div><figcaption>Trail</figcaption></figure>
    </section>
  </main>
</body>
</html>
