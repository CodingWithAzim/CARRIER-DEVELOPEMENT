<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background-Color-Changer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main">
      <div class="buttonDiv">
        <button class="buttonOne">#5B06D2</button>
        <button class="buttonTwo">#34BC59</button>
      </div>
      <div class="copyText">Copy your code here</div>
      <div class="showColor">
        background-image: linear-gradient(to right, rgb(91, 6, 210), rgb(52,
        188, 89))
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
