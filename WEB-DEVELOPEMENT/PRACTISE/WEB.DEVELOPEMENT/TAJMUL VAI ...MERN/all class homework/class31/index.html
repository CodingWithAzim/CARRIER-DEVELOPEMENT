<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class31 Homework</title>
  <style>
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .typing-container {
      font-size: 50px;
      font-weight: bold;
    }

    .cursor {
      color: white;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="typing-container">
    <span id="typed-text" data-text="Class31 Homework Complete...." data-speed="180"></span><span class="cursor">|</span>
  </div>

  <script src="./main.js"></script>
</body>
</html>
