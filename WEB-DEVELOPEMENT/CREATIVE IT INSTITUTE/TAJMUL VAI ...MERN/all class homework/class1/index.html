<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <section id="sign_1">
    <div class="container">
            <div class="sign_top">
                <h3>Create account</h3>
                <p>For businness, band or celebrity</p>
            </div>
            <div class="sign_med">
                <div class="sign_med_1">
                    <form>
                        <label for="name"><p>Frist name</p></label>
                        <input id="name" class="form_left" type="text">
                        
                        <label for="email"><p>Email or Phone Number</p></label>
                        <input id="email" class="form_left" type="email number">
                        
                        <label for="pass"><p>Password</p></label>
                        <input id="pass" class="form_left" type="password">
                    </form>
                </div>
                <div class="sign_med_2">
                    <form>
                        <label for="last"><p>Last name</p></label>
                        <input id="last" class="form_left" type="text">
                        
                        <label for="date"><p>Date of birth (mm/dd/yy)</p></label>
                        <input id="date" class="form_left birth" type="date">
                        
                        <label for="conf"><p>Confirm Password</p></label>
                        <input id="conf" class="form_left" type="password">
                    </form>
                </div>
            </div>
            <div class="sign_bott">
                <div class="sign_bott_01">
                    <form>
                        <label for="remem">
                        <input id="remem" class="rem" type="checkbox"> Remember me
                        </label>
                    </form>
                    <form>
                        <label for="agry">
                        <input id="agry" class="rem" type="checkbox"> I agree to all the <a href="#">Trems</a> and <a href="#">Privacy policy</a>
                        </label>
                    </form>
                </div>
                <div class="sign_bott_02">
                    <a href="#">Forgot Password?</a>
                </div>
            </div>

            <div class="button">
                <button class="butt_1"><a href="#">Create account</a></button>
                <button class="butt_2"><a href="#"> <img src="img0.png" alt=""> Sign-in-with google</a></button>
            </div>

            <div class="pra">
                <p>Don't have an account?<a href="#">Log in</a></p>
            </div>
            <div class="img">
                <img src="img1.png" alt="">
                <img src="img2.png" alt="">
            </div>

        
    </div>
    </section>
